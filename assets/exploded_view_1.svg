<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1600" viewBox="0 0 1000 1600" font-family="Microsoft YaHei, sans-serif">
  <rect width="1000" height="1600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">手表部件爆炸图 — 固定公模基底 vs 开放可定制区域</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#666">EXPLODED VIEW · 自上而下：表镜 → 表盘 → 指针 → 机芯 → 表壳 → 表冠 → 表带</text>

  <!-- center alignment guide -->
  <line x1="320" y1="90" x2="320" y2="1280" stroke="#bbb" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- ① 表镜 Sapphire Crystal -->
  <g>
    <ellipse cx="320" cy="140" rx="170" ry="26" fill="#eef6fb" stroke="#333" stroke-width="2"/>
    <ellipse cx="320" cy="134" rx="120" ry="14" fill="none" stroke="#9ab" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="150" cy="140" r="14" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="150" y="145" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">①</text>
    <text x="520" y="134" font-size="17" font-weight="bold" fill="#1a1a1a">表镜（蓝宝石玻璃）SAPPHIRE CRYSTAL</text>
    <text x="520" y="156" font-size="13" fill="#c0392b" font-weight="bold">● 固定公模基底 — 开窗尺寸与弧度由表壳决定，不可改</text>
  </g>

  <!-- ② 表盘 Dial -->
  <g>
    <ellipse cx="320" cy="320" rx="165" ry="25" fill="#2b2f33" stroke="#333" stroke-width="2"/>
    <g stroke="#6b7580" stroke-width="1" opacity="0.8">
      <line x1="320" y1="296" x2="320" y2="344"/>
      <line x1="245" y1="306" x2="395" y2="334"/>
      <line x1="245" y1="334" x2="395" y2="306"/>
      <line x1="200" y1="320" x2="440" y2="320"/>
    </g>
    <circle cx="150" cy="320" r="14" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="150" y="325" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">②</text>
    <text x="520" y="314" font-size="17" font-weight="bold" fill="#1a1a1a">表盘 DIAL</text>
    <text x="520" y="336" font-size="13" fill="#4A5A68" font-weight="bold">◆ 开放可定制区域 — 图案（太阳放射纹/格纹/珠光贝母/MOPA微雕等）与颜色可自由选择</text>
  </g>

  <!-- ③ 指针 Hands -->
  <g>
    <ellipse cx="320" cy="500" rx="150" ry="22" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="320" y1="500" x2="320" y2="460" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="320" y1="500" x2="375" y2="500" stroke="#1a1a1a" stroke-width="4"/>
    <circle cx="320" cy="500" r="5" fill="#1a1a1a"/>
    <circle cx="150" cy="500" r="14" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="150" y="505" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">③</text>
    <text x="520" y="494" font-size="17" font-weight="bold" fill="#1a1a1a">指针 HANDS</text>
    <text x="520" y="516" font-size="13" fill="#4A5A68" font-weight="bold">◆ 开放可定制区域 — 剑形 / 棒形等款式可选，针数（三针/六针）独立可选</text>
  </g>

  <!-- ④ 机芯 Movement -->
  <g>
    <ellipse cx="320" cy="680" rx="150" ry="24" fill="#dcdcdc" stroke="#333" stroke-width="2"/>
    <g stroke="#888" stroke-width="0.9">
      <circle cx="320" cy="680" r="10" fill="none"/>
      <circle cx="320" cy="680" r="20" fill="none"/>
      <circle cx="320" cy="680" r="34" fill="none" opacity="0.6"/>
    </g>
    <circle cx="150" cy="680" r="14" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="150" y="685" text-anchor="middle" font-size="13" fill="#b8860b" font-weight="bold">④</text>
    <text x="520" y="674" font-size="17" font-weight="bold" fill="#1a1a1a">机芯 MOVEMENT</text>
    <text x="520" y="696" font-size="13" fill="#b8860b" font-weight="bold">▲ 结构决定项 — 石英/自动机械（产地：日本 Miyota 9015 / 瑞士 Sellita）决定表壳厚度</text>
  </g>

  <!-- ⑤ 表壳 Case -->
  <g>
    <polygon points="320,618 390,636 420,680 390,724 320,742 250,724 220,680 250,636"
             fill="#e8e8e8" stroke="#222" stroke-width="2.5" transform="translate(0,180) scale(1,0.34)"/>
    <!-- simplified case silhouette drawn directly at band y=860 -->
    <polygon points="320,834 400,854 435,860 435,900 400,906 320,926 240,906 205,900 205,860 240,854"
              fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
    <path d="M205,860 L175,845 Q165,840 170,850 L178,872 Z" fill="#d9d9d9" stroke="#333" stroke-width="1.2"/>
    <path d="M435,860 L465,845 Q475,840 470,850 L462,872 Z" fill="#d9d9d9" stroke="#333" stroke-width="1.2"/>
    <path d="M205,900 L175,915 Q165,920 170,910 L178,888 Z" fill="#d9d9d9" stroke="#333" stroke-width="1.2"/>
    <path d="M435,900 L465,915 Q475,920 470,910 L462,888 Z" fill="#d9d9d9" stroke="#333" stroke-width="1.2"/>
    <circle cx="150" cy="880" r="14" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="150" y="885" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">⑤</text>
    <text x="520" y="864" font-size="17" font-weight="bold" fill="#1a1a1a">表壳 CASE</text>
    <text x="520" y="886" font-size="13" fill="#c0392b" font-weight="bold">● 固定公模基底 — 表壳本体、表耳结构、表冠开孔位置均不可改，免开模费</text>
  </g>

  <!-- ⑥ 表冠 Crown -->
  <g>
    <ellipse cx="320" cy="1040" rx="150" ry="20" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="455" y="1028" width="22" height="24" rx="3" fill="#cfcfcf" stroke="#333" stroke-width="1.5"/>
    <circle cx="150" cy="1040" r="14" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="150" y="1045" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">⑥</text>
    <text x="520" y="1034" font-size="17" font-weight="bold" fill="#1a1a1a">表冠 CROWN</text>
    <text x="520" y="1056" font-size="13" fill="#1a1a1a">
      <tspan fill="#c0392b" font-weight="bold">● 位置/开孔直径固定</tspan>　　<tspan fill="#4A5A68" font-weight="bold">◆ 品牌刻字/颜色装饰可定制</tspan>
    </text>
  </g>

  <!-- ⑦ 表带 Strap -->
  <g>
    <path d="M250,1190 L390,1190 L384,1160 Q380,1150 365,1150 L275,1150 Q260,1150 256,1160 Z" fill="#4a3527" stroke="#222" stroke-width="1.5"/>
    <path d="M250,1250 L390,1250 L384,1280 Q380,1290 365,1290 L275,1290 Q260,1290 256,1280 Z" fill="#4a3527" stroke="#222" stroke-width="1.5"/>
    <g stroke="#2c1f16" stroke-width="1" opacity="0.85">
      <line x1="262" y1="1165" x2="378" y2="1165"/><line x1="258" y1="1175" x2="382" y2="1175"/>
      <line x1="262" y1="1265" x2="378" y2="1265"/><line x1="258" y1="1275" x2="382" y2="1275"/>
    </g>
    <circle cx="150" cy="1220" r="14" fill="none" stroke="#4A5A68" stroke-width="1.5"/>
    <text x="150" y="1225" text-anchor="middle" font-size="13" fill="#4A5A68" font-weight="bold">⑦</text>
    <text x="520" y="1214" font-size="17" font-weight="bold" fill="#1a1a1a">表带 STRAP</text>
    <text x="520" y="1236" font-size="13" fill="#4A5A68" font-weight="bold">◆ 开放可定制区域 — 材质（牛皮/橡胶/不锈钢链带/NATO尼龙）与颜色可自由选择</text>
  </g>

  <!-- LEGEND -->
  <g font-size="13" fill="#333">
    <rect x="60" y="1310" width="880" height="1" fill="#ddd"/>
    <text x="60" y="1340" font-size="14" font-weight="bold" fill="#1a1a1a">图例 LEGEND</text>

    <circle cx="75" cy="1368" r="9" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="95" y="1373" font-size="13" fill="#333">固定公模基底 · 不可改 · 免开模费（表壳本体 / 表耳结构 / 表冠开孔位置 / 表镜开窗）</text>

    <circle cx="75" cy="1398" r="9" fill="none" stroke="#4A5A68" stroke-width="2"/>
    <text x="95" y="1403" font-size="13" fill="#333">开放可定制区域（表盘图案 / 指针款式 / 表带材质与颜色 / 表冠装饰 / 底盖类型 / 圈口花纹）</text>

    <circle cx="75" cy="1428" r="9" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="95" y="1433" font-size="13" fill="#333">结构决定项（机芯选择：石英 / 自动机械，直接决定表壳厚度结构）</text>

    <text x="60" y="1470" font-size="12" fill="#888">注：以上为设计说明示意图，非真实工程图纸，最终结构以实际模具与打样为准。</text>
  </g>
</svg>
