    <path d="M164,20 L296,20 L292,-25 Q290,-32 280,-32 L180,-32 Q170,-32 168,-25 Z" fill="#4a3527" stroke="#222" stroke-width="1.5"/>
    <path d="M164,400 L296,400 L292,445 Q290,452 280,452 L180,452 Q170,452 168,445 Z" fill="#4a3527" stroke="#222" stroke-width="1.5"/>
