    <g stroke="#9a9a9a" stroke-width="1" opacity="0.9">
      <line x1="150" y1="55" x2="150" y2="75"/><line x1="158" y1="51" x2="158" y2="72"/><line x1="166" y1="48" x2="166" y2="69"/><line x1="174" y1="46" x2="174" y2="67"/>
      <line x1="294" y1="55" x2="294" y2="75"/><line x1="302" y1="51" x2="302" y2="72"/><line x1="310" y1="48" x2="310" y2="69"/><line x1="286" y1="46" x2="286" y2="67"/>
      <line x1="150" y1="345" x2="150" y2="365"/><line x1="158" y1="348" x2="158" y2="369"/><line x1="166" y1="351" x2="166" y2="372"/><line x1="174" y1="353" x2="174" y2="374"/>
      <line x1="294" y1="345" x2="294" y2="365"/><line x1="302" y1="348" x2="302" y2="369"/><line x1="310" y1="351" x2="310" y2="372"/><line x1="286" y1="353" x2="286" y2="374"/>
