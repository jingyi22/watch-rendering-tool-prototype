  <!-- LEGEND -->
  <g font-size="12.5" fill="#333">
    <rect x="60" y="720" width="980" height="1" fill="#ddd"/>
    <text x="60" y="743"><tspan font-weight="bold" fill="#c0392b">①</tspan> 12点尖顶饰标：pyramidion四棱尖顶造型，金色PVD，呼应碑顶贴金</text>
    <text x="60" y="765"><tspan font-weight="bold" fill="#c0392b">②</tspan> 表冠 Ø6.0mm　　<tspan font-weight="bold" fill="#c0392b">③</tspan> 表圈四段渐变收窄切面，全周拉丝纹理</text>
  </g>
  <g font-size="12.5" fill="#333" transform="translate(560,0)">
    <text x="60" y="743"><tspan font-weight="bold" fill="#c0392b">④</tspan> 表背同心圆放射纹车花（实际为全面覆盖细密车花，非仅示意线）</text>
    <text x="60" y="765"><tspan font-weight="bold" fill="#c0392b">⑤⑥</tspan> 侧腰微凸弧线 ≤0.3mm　　深棕色牛皮表带，压线装饰，宽度18.0mm</text>
