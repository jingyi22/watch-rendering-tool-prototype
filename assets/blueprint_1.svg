  <text x="550" y="28" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">方案一「本本石」极简款 — 表壳规格图（单位：mm）</text>

  <text x="230" y="46" text-anchor="middle" font-size="14" fill="#444">正视图（含表带示意）</text>
