  <!-- SIDE VIEW -->
  <g transform="translate(0,95)">
    <path d="M600,120 L590,105 L610,98 L640,98 L640,322 L610,322 L590,315 L600,300 Z" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/>

