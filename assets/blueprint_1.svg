      <line x1="176" y1="395" x2="284" y2="395"/><line x1="173" y1="405" x2="287" y2="405"/><line x1="171" y1="415" x2="289" y2="415"/><line x1="169" y1="425" x2="291" y2="425"/>
    </g>
