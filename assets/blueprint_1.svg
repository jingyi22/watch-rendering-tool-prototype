    <circle cx="200" cy="-25" r="12" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="200" y="-21" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">⑥</text>

    <!-- lugs -->
    <path d="M170,70 L150,25 Q145,18 155,16 L180,10 Q195,8 200,25 L206,65 Z" fill="#d9d9d9" stroke="#333" stroke-width="1.5"/>
    <path d="M290,70 L310,25 Q315,18 305,16 L280,10 Q265,8 260,25 L254,65 Z" fill="#d9d9d9" stroke="#333" stroke-width="1.5"/>
