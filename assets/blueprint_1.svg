    <rect x="326" y="198" width="22" height="24" rx="3" fill="#cfcfcf" stroke="#333" stroke-width="1.5"/>
    <circle cx="337" cy="210" r="12" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="337" y="214" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">②</text>

    <circle cx="230" cy="285" r="12" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="230" y="289" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">③</text>

    <line x1="130" y1="465" x2="330" y2="465" stroke="#c0392b" stroke-width="1"/>
    <line x1="130" y1="455" x2="130" y2="475" stroke="#c0392b"/>
    <line x1="330" y1="455" x2="330" y2="475" stroke="#c0392b"/>
