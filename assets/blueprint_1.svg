    <path d="M600,315 L588,345 L608,345 L640,332 L640,315 Z" fill="#4a3527" stroke="#222" stroke-width="1.2"/>

    <line x1="770" y1="80" x2="790" y2="80" stroke="#333"/>
    <line x1="770" y1="340" x2="790" y2="340" stroke="#333"/>
    <line x1="780" y1="80" x2="780" y2="340" stroke="#333" stroke-width="1"/>
    <text x="820" y="213" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 820,213)">表壳厚度 10.8</text>
